<style>
/* Layout: one phone column (max 430px): shared plan header → divider → tab section (Meal | Measure) → floating tab bar.
   Tokens mirror Figma file "Jebal", Page 3; new components reuse the same surfaces: grey ground, #f6f6f6 cards r14, rgba pills r10, mono numbers. */
:root{
  --bg:#f7f7f7; --ink:#000; --ink-50:rgba(0,0,0,.6); --ink-40:rgba(0,0,0,.55); --ink-28:rgba(0,0,0,.3);
  --fill-8:rgba(0,0,0,.1); --fill-6:rgba(0,0,0,.07); --fill-3:rgba(0,0,0,.035);
  --line:rgba(0,0,0,.1); --card:#ffffff; --merge:#ececec; --dot:#cecece;
  --blue:#1f56c9; --over:#1c1c1e; --win:#9fb3d8;
  --ghost:#d57b0e; --ghost-ink:#905105; --ghost-fill:rgba(213,123,14,.16); --ghost-fill-0:rgba(213,123,14,.08); --ghost-ink-0:rgba(144,81,4,.5);
  --red:#d63a2f; --red-fill:rgba(214,58,47,.13);
  --key-sheet:rgba(209,212,218,.92); --key:#fff; --done:#3478f6;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --lift:0 0 2px rgba(0,0,0,.06),0 8px 52px rgba(0,0,0,.10);
  --spring:cubic-bezier(.3,1.25,.5,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root{ --spring: linear(0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%, 0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%, 1.001 85.9%, 1); }
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-feature-settings:"ss17" 1;overscroll-behavior-y:none}
body.kb-open{padding-bottom:340px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
svg{display:block}
[hidden]{display:none!important}
.per{display:flex;gap:2px;margin-left:auto;flex:none}
.per button{height:28px;padding:0 8px;border-radius:8px;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-40);transition:background-color .25s,color .25s}
.per button.on{background:var(--fill-8);color:var(--ink)}
.mtitle{display:flex;align-items:center;gap:2px;min-width:0}
.mtitle svg{width:12px;height:12px;flex:none;margin-left:4px;transition:transform .3s var(--spring)}
.mtitle:active svg{transform:translateY(2px)}
.amt{flex:none;align-self:center;font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding-left:8px}
.row.muted .amt,.row.muted .name{color:rgba(0,0,0,.45)}
.foot{margin-top:24px;font-size:13px;line-height:18px;color:var(--ink-50);text-align:center}
.foot button{font-weight:590;color:var(--ink);padding:2px 4px}
#bars.plain .track,#bars.plain .sl,#bars.plain .goal{display:none}
#bigRow.plain .ring,#bigRow.plain .sl,#bigRow.plain #bGoal{display:none}
#bigRow .ring{transition:opacity .3s}
.app{max-width:430px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}

/* ---------- plan header ---------- */
.plan{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.title-row{display:flex;align-items:center;gap:8px;height:24px}
.title-row h1{margin:0;font-size:20px;line-height:22px;font-weight:510;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-row .ptype{margin-left:auto;font-size:12px;line-height:12px;font-weight:590;color:var(--ink-50);text-transform:uppercase;letter-spacing:.5px}
.dots{flex:none;width:40px;height:24px;border-radius:12px;transition:transform .2s var(--ease),opacity .2s}
.dots:active{transform:scale(.9);opacity:.6}
.kcal-row{display:flex;align-items:center;gap:8px;height:36px;margin-top:22px}
.ring{position:relative;width:32px;height:32px;flex:none}
.ring svg{position:absolute;inset:0;overflow:visible}
.ring .trk{transition:stroke .35s,stroke-opacity .35s}
.ring .arc{transition:stroke-dashoffset .8s var(--spring),opacity .3s}
.ring .lap{transition:stroke-dashoffset .8s var(--spring),opacity .3s}
.ring .cap{transform-origin:16px 16px;transform-box:view-box;transition:transform .8s var(--spring),opacity .3s}
.ring .chk{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .45s var(--ease) .15s}
.ring.done .chk{stroke-dashoffset:0}
.ring.pop{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:none}}
.kcal{font-size:36px;line-height:36px;font-weight:510;letter-spacing:-.72px;white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;min-width:0}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.mlabel{font-size:12px;line-height:12px;font-weight:590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.track{position:relative;height:16px;margin-top:6px;border-radius:4px;background:rgba(0,0,0,.1)}
.track .win{position:absolute;top:0;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:4px;background:var(--win)}
.track .mark{position:absolute;top:-2px;width:4px;height:20px;border-radius:24px;background:var(--ink);
  left:clamp(0px,calc(50% + var(--off,0px) - 2px),calc(100% - 4px));transition:left .7s var(--spring),background-color .3s,opacity .3s}
.track .mark.in{background:var(--blue)}
.track .mark.none{opacity:0}
.divider{height:1px;background:var(--line);margin:24px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}

/* ---------- section heads ---------- */
.list-head{display:flex;align-items:center;height:28px;margin-top:11px}
.list-head h2{margin:0;font-size:18px;line-height:20px;font-weight:510;letter-spacing:-.36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.list-head .dots{margin-left:8px}
.list-head.sub{margin-top:28px}
.tools{display:flex;gap:8px;margin-left:auto;padding-left:12px;flex:none}
.ibtn{position:relative;width:28px;height:28px;flex:none;transition:transform .25s var(--spring),color .3s}
.ibtn::after{content:"";position:absolute;inset:-6px -4px}
.ibtn:active{transform:scale(.86)}
.ibtn svg{width:28px;height:28px}
#ghostBtn{color:#000}
body.ghost #ghostBtn{color:var(--ghost);animation:wob .6s var(--spring)}
@keyframes wob{0%{transform:none}30%{transform:rotate(-12deg) scale(1.15)}60%{transform:rotate(8deg)}100%{transform:none}}
.search{display:flex;align-items:center;gap:8px;margin-top:14px;height:36px;padding:0 12px;border-radius:10px;background:var(--fill-6);animation:drop .35s var(--spring)}
.search[hidden]{display:none!important}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;letter-spacing:-.32px;outline:none;color:var(--ink);-webkit-user-select:text;user-select:text}
.search button{font-size:16px;color:var(--ink-50)}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------- rows (products, groups, log) ---------- */
.list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;isolation:isolate}
.row{position:relative;min-height:34px;touch-action:pan-y}
.rc{position:relative;z-index:1;display:flex;align-items:flex-end;gap:12px;will-change:transform}
.row::before{content:"";position:absolute;inset:-4px;border-radius:14px;background:var(--card);box-shadow:var(--lift);
  opacity:0;transform:scale(.97);transition:opacity .25s,transform .35s var(--spring),background-color .2s;z-index:-1;pointer-events:none}
.row.lifted::before,.row.editing::before{opacity:1;transform:none}
.row.editing::before{box-shadow:none}
.row.merge-target::before{opacity:1;transform:none;background:var(--merge);box-shadow:none}
.pill{flex:none;display:flex;align-items:center;min-width:64px;height:34px;padding:8px;border-radius:10px;background:var(--fill-6);
  font-family:var(--mono);font-size:14px;line-height:14px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;
  transition:background-color .35s,color .35s,transform .3s var(--spring)}
body.ghost-anim .pill{transition-delay:var(--d,0s),var(--d,0s),0s}
.pill:active{transform:scale(.94)}
.lifted .pill,.editing .pill,.group .pill{background:var(--fill-8)}
.row.zero>.rc>.pill,.group.zero>.ghead>.rc>.pill{background:var(--fill-3);color:rgba(0,0,0,.42)}
.info{flex:1;min-width:0;display:flex;flex-direction:column;cursor:pointer}
.name{font-size:16px;line-height:20px;letter-spacing:-.32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.mac{display:flex;gap:8px;font-size:12px;line-height:14px;color:rgba(0,0,0,.78);white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"ss17" 1,"cv08" 1;overflow:hidden}
.mac i{font-style:normal;color:rgba(0,0,0,.4);margin-right:1px}
.row.zero>.rc .name,.group.zero>.ghead .name{color:rgba(0,0,0,.45)}
.row.zero>.rc .mac,.group.zero>.ghead .mac{color:rgba(0,0,0,.32)}
.row.zero>.rc .mac i,.group.zero>.ghead .mac i{color:rgba(0,0,0,.25)}
.slot{visibility:hidden}
.row.pressing>.rc,.group.pressing{transform:scale(.985);transition:transform .38s var(--ease)}
body.ghost .pill{background:var(--ghost-fill);color:var(--ghost-ink)}
body.ghost .row.zero>.rc>.pill,body.ghost .group.zero>.ghead>.rc>.pill{background:var(--ghost-fill-0);color:var(--ghost-ink-0)}
.caret{display:inline-block;width:1.5px;height:17px;background:currentColor;margin:0 1px;border-radius:1px;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.ph{color:rgba(0,0,0,.28)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* swipe actions: same pill geometry as the grams pill */
.acts{position:absolute;z-index:0;right:0;bottom:0;display:flex;gap:6px;opacity:var(--rv,0);transform:scale(calc(.85 + var(--rv,0) * .15));transform-origin:right center;pointer-events:none}
.sw-open .acts{pointer-events:auto}
.sa{width:52px;height:34px;border-radius:10px;display:grid;place-items:center;transition:transform .25s var(--spring),background-color .2s}
.sa:active{transform:scale(.9)}
.sa svg{width:20px;height:20px}
.sa.ed{background:var(--fill-8);color:var(--ink)}
.sa.del{background:var(--red-fill);color:var(--red)}

/* group */
.group{position:relative;margin:-4px;padding:4px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;gap:4px;touch-action:pan-y;transition:background-color .2s,box-shadow .3s}
.group.lifted{box-shadow:var(--lift)}
.group.merge-target{background:var(--merge)}
.ghead{position:relative}
.ghead .name{font-weight:510;letter-spacing:-.16px;display:flex;align-items:center;overflow:visible}
.gname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chev{position:relative;flex:none;width:24px;height:20px;display:grid;place-items:center}
.chev::after{content:"";position:absolute;inset:-10px -8px}
.chev svg{width:12px;height:12px;transition:transform .45s var(--spring)}
.group:not(.open) .chev svg{transform:rotate(-90deg)}
.kids{list-style:none;margin:0;padding:0 0 0 16px;display:flex;flex-direction:column;gap:4px;isolation:isolate}
.kids:empty{display:none}
.kids .row::after{content:"";position:absolute;left:-12px;top:15px;width:4px;height:4px;border-radius:50%;background:var(--dot)}
.empty{padding:36px 8px;text-align:center;color:var(--ink-50);font-size:15px;line-height:20px;list-style:none}
.empty b{display:block;color:var(--ink);font-weight:510;font-size:17px;margin-bottom:4px}
.drag-clone{position:fixed;z-index:25;margin:0;pointer-events:none;will-change:transform;list-style:none}
.drag-clone.row::before{opacity:1;transform:none}
.drag-clone.group{box-shadow:var(--lift)}

/* ---------- layout v2 (main screen redesign) ---------- */
.kwrap{min-width:0}
.ksub{display:none}
.mtitle .pchev{display:none}
.zhead{display:none}
body.v2 .mtitle .pchev{display:block}

body.v2 .zhead{display:flex;align-items:center;gap:6px;margin:28px 0 0;padding:0;height:24px;font-size:13px;font-weight:590;color:var(--ink-50);letter-spacing:.2px}
body.v2 .zhead svg{width:12px;height:12px;opacity:.6;transition:transform .35s var(--spring)}

/* ---------- tab sections ---------- */
.tabsec[hidden]{display:none!important}

/* ---------- measure ---------- */
.seg{position:relative;display:flex;padding:2px;border-radius:10px;background:var(--fill-6);height:32px;box-sizing:border-box}
.seg .thumb{position:absolute;top:2px;bottom:2px;border-radius:8px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04);
  transition:left .45s var(--spring),width .45s var(--spring)}
.seg button{position:relative;flex:1;font-size:13px;line-height:28px;font-weight:510;color:var(--ink-50);transition:color .25s}
.seg button.on{color:var(--ink)}
#period{margin-top:14px}
.chart{position:relative;margin-top:14px;height:196px;touch-action:pan-y}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .ylab,.chart .xlab{font-family:var(--mono);font-size:10px;fill:var(--ink-40)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .pt{fill:var(--ink-28)}
.chart .trend{fill:none;stroke:#000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chart .last{fill:#000;stroke:var(--bg);stroke-width:2}
.chart .hair{stroke:rgba(0,0,0,.25);stroke-width:1}
.chart .hdot{fill:#000;stroke:var(--bg);stroke-width:2}
.chart .goal-lab{font-family:var(--mono);font-size:10px;fill:var(--blue)}
.chart .empty{position:absolute;inset:0;display:grid;place-items:center;padding:0}
.tip{position:absolute;top:0;pointer-events:none;background:var(--card);border-radius:10px;box-shadow:var(--lift);padding:6px 9px;white-space:nowrap;
  font-size:12px;line-height:15px;color:var(--ink-50);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .2s var(--spring)}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-family:var(--mono);font-size:14px;line-height:17px;font-weight:600;color:var(--ink)}
.stats{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.stats .rc{align-items:flex-end}
.sug{margin:24px -4px 0;padding:12px;border-radius:14px;background:var(--card);animation:drop .45s var(--spring)}
.sug-h{display:flex;align-items:center;gap:6px;font-size:12px;line-height:14px;font-weight:590;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-50)}

.sug-t{margin-top:8px;font-size:15px;line-height:20px;letter-spacing:-.2px}
.sug-t b{font-family:var(--mono);font-weight:600;font-size:14px}
.sug-b{display:flex;gap:8px;margin-top:12px}
.sug-b .sbtn{margin:0;height:40px;font-size:15px;border-radius:10px}
.more{display:block;margin:16px auto 0;height:34px;padding:0 14px;border-radius:10px;background:var(--fill-6);font-size:14px;font-weight:510;color:var(--ink-50)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(20px,calc(env(safe-area-inset-bottom,0px) - 12px));
  display:flex;align-items:center;gap:16px;height:64px;padding:0 24px;border-radius:80px;background:#fff;
  box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);transition:transform .45s var(--spring),opacity .3s}

.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:14px;color:var(--ink-40);font-feature-settings:"ss17" 1,"cv08" 1;transition:transform .3s var(--spring),color .3s}
.tab:active{transform:scale(.9)}
.tab svg{width:28px;height:28px;opacity:.55;transition:opacity .3s}
.tab.on{color:var(--ink)}
.tab.on svg{opacity:1}

/* ---------- precise edit ---------- */
.precise{position:fixed;z-index:20;left:0;right:0;bottom:0;top:var(--ptop,0px);background:rgba(247,247,247,.1);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);opacity:0;transition:opacity .3s var(--ease);touch-action:none}
.precise.show{opacity:1}
.pcard{position:absolute;display:flex;gap:16px;align-items:flex-start;color:var(--ink)}

.pvals{display:flex;flex-direction:column;padding-top:5px}
.pg{font-family:var(--mono);font-size:22px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums}
.pn{font-size:16px;line-height:20px;font-weight:510;letter-spacing:-.16px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pm b{font-weight:400}
.pmax{margin-top:8px;font-size:12px;line-height:14px;color:var(--ink-50)}
.pcard.bump{animation:shake .35s}

/* ---------- keypad ---------- */
.kb{position:fixed;z-index:40;left:0;right:0;bottom:0;background:var(--key-sheet);
  -webkit-backdrop-filter:blur(30px) saturate(1.4);backdrop-filter:blur(30px) saturate(1.4);
  border-radius:24px 24px 0 0;padding:0 max(8px,env(safe-area-inset-right,0px)) calc(max(env(safe-area-inset-bottom,0px),34px) + 27px) max(8px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .45s var(--spring)}
.kb.show{transform:none}
.kb-in{max-width:430px;margin:0 auto}
.kb-top{height:53px;display:flex;align-items:center;justify-content:flex-end;padding-right:13px}
.kb-top button{font-size:17px;color:var(--done);padding:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 6px}
.key{height:49px;border-radius:8.5px;background:var(--key);box-shadow:0 1px 0 rgba(0,0,0,.28);font-size:25px;line-height:1;font-weight:400;display:grid;place-items:center;transition:background-color .12s,transform .12s}
.key:active{background:#b5b9c1;transform:scale(.97)}
.key.bare{background:none;box-shadow:none}
.key.bare:active{background:rgba(255,255,255,.4)}
.key svg{width:26px;height:20px}
.key[hidden]{visibility:hidden;display:grid!important}

/* ---------- sheets, menus, toast: built from the main screen's parts (pill left, label right, capsules, soft lift) ---------- */
.scrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,0);transition:background-color .35s}
.scrim.show{background:rgba(0,0,0,.12)}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:var(--bg);border-radius:34px 34px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .55s var(--spring);box-shadow:0 0 2px rgba(0,0,0,.06),0 -12px 52px rgba(0,0,0,.10);max-height:88vh;overflow:auto;overscroll-behavior:contain;box-sizing:border-box}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(0,0,0,.12);margin:0 auto 16px}
.sheet h3{margin:0 0 18px;font-size:20px;line-height:24px;font-weight:510;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;flex:none;width:40px;height:24px;border-radius:12px;background:var(--fill-6);display:grid;place-items:center;transition:transform .2s var(--spring)}
.sheet h3 .x:active{transform:scale(.9)}
.sheet h3 .x svg{width:10px;height:10px}
.cap{font-size:13px;line-height:16px;font-weight:510;color:var(--ink-50);margin:24px 0 10px;display:flex;gap:6px;letter-spacing:-.1px}
.cap .r{margin-left:auto;font-weight:400}
.card{display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:12px;min-height:34px;font-size:16px;letter-spacing:-.32px}
.field>label,.field>.fl{flex:1;min-width:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .hint{display:block;font-size:12px;line-height:14px;color:var(--ink-50);letter-spacing:0}
.inp{order:-1;flex:none;display:flex;align-items:center;gap:2px;min-width:96px;box-sizing:border-box;height:34px;padding:0 10px;border-radius:10px;background:var(--fill-6);font-family:var(--mono);font-size:14px;font-weight:600;transition:background-color .2s,box-shadow .2s}
.inp:focus-within{background:var(--card);box-shadow:var(--lift)}
.inp input{width:56px;border:0;background:none;padding:0;font:inherit;text-align:left;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums}
.inp input::placeholder{color:var(--ink-28)}
.inp .u{color:var(--ink-40);font-weight:600}
.inp input[type=date]{width:auto;min-width:120px;-webkit-appearance:none;appearance:none}
.calc{order:-1;flex:none;display:flex;align-items:center;min-width:96px;box-sizing:border-box;height:34px;padding:0 10px;border-radius:10px;background:var(--fill-3);font-family:var(--mono);font-weight:600;font-size:14px}
.tfield{display:flex;align-items:center;height:46px;padding:0 14px;border-radius:12px;background:var(--fill-6);transition:background-color .2s,box-shadow .2s}
.tfield:focus-within{background:var(--card);box-shadow:var(--lift)}
.tfield input{flex:1;min-width:0;border:0;background:none;padding:0;font:inherit;font-size:17px;letter-spacing:-.3px;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text}
.tfield input::placeholder{color:var(--ink-28)}
.sbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;border-radius:25px;font-size:17px;font-weight:510;letter-spacing:-.3px;margin-top:12px;transition:transform .25s var(--spring),opacity .2s,background-color .2s}
.card+.sbtn,.seg+.sbtn,.note+.sbtn,.tfield+.sbtn,p+.sbtn{margin-top:26px}
.sbtn:active{transform:scale(.97);opacity:.85}
.sbtn.primary{background:#000;color:#fff}
.sbtn.plain{background:var(--fill-6)}
.sbtn.danger{background:var(--fill-6);color:var(--red)}
.btnrow{display:flex;gap:8px}
.btnrow .sbtn{flex:1;height:44px;font-size:16px}
.note{font-size:14px;line-height:19px;color:var(--ink-50);margin:0 0 8px}
.menu{position:fixed;z-index:50;min-width:250px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:6px;border-radius:22px;
  background:rgba(250,250,250,.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 0 2px rgba(0,0,0,.06),0 14px 52px rgba(0,0,0,.14);
  transform-origin:var(--ox,0) var(--oy,0);animation:menuIn .42s var(--spring)}
.menu.out{animation:menuOut .2s var(--ease) forwards}
@keyframes menuIn{from{opacity:0;transform:scale(.55);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes menuOut{to{opacity:0;transform:scale(.9);filter:blur(4px)}}
.mi{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px 0 10px;border-radius:15px;font-size:16px;letter-spacing:-.32px;text-align:left;transition:background-color .15s}
.mi:active{background:rgba(0,0,0,.06)}
.mi .ck{width:18px;flex:none;display:grid;place-items:center}
.mi .ck svg{width:13px;height:13px}
.mi .ml{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .mr{color:var(--ink-40);font-family:var(--mono);font-size:12px;font-weight:600}
.mi.danger{color:var(--red)}
.mi[disabled]{opacity:.35;pointer-events:none}
.mlab{padding:8px 12px 4px 36px;font-size:13px;line-height:16px;font-weight:510;color:var(--ink-50)}
.msep{height:1px;margin:6px 12px;background:var(--line)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(max(20px,calc(env(safe-area-inset-bottom,0px) - 12px)) + 76px);transform:translate(-50%,24px) scale(.96);opacity:0;
  display:flex;align-items:center;gap:12px;color:var(--ink);font-size:14px;line-height:18px;padding:11px 16px;border-radius:22px;
  background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 0 0 .5px rgba(0,0,0,.05),0 8px 32px rgba(0,0,0,.10);
  transition:transform .45s var(--spring),opacity .25s;white-space:nowrap;max-width:calc(100vw - 32px);pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast .tm{overflow:hidden;text-overflow:ellipsis}
.toast button{font-weight:590;height:28px;padding:0 12px;margin:-4px -8px -4px 0;border-radius:14px;background:var(--fill-6)}
body.kb-open .toast{bottom:356px}

/* ---------- meal: header and list title stay put, only the list scrolls ---------- */
body.tab-meal .plan{position:sticky;top:0;z-index:15;background:var(--bg)}
body.tab-meal .mhead{position:sticky;top:var(--hh,0px);z-index:14;background:var(--bg);padding-bottom:10px;transition:box-shadow .25s}
body.tab-meal .mhead.stuck{box-shadow:0 1px 0 var(--line)}
body.tab-meal #list{margin-top:6px}
body.tab-meal .plan,body.tab-meal .mhead{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
body.tab-budget .plan{display:none}

/* ---------- measure hero ---------- */
.mhero{display:none;margin-top:22px}
body.tab-measure #bigRow,body.tab-measure #bars{display:none}
body.tab-measure .mhero{display:block}
.mh-top{display:flex;align-items:baseline;gap:6px}
.mh-w{font-size:40px;line-height:40px;font-weight:510;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.mh-u{font-size:20px;color:var(--ink-50);font-weight:510;letter-spacing:-.3px}
.mh-chip{margin-left:auto;align-self:center;display:flex;align-items:center;height:28px;padding:0 10px;border-radius:10px;background:var(--fill-6);font-family:var(--mono);font-size:13px;font-weight:600;transition:color .3s}

.mh-dot{position:absolute;top:50%;left:var(--p,0%);width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#000;box-shadow:0 0 0 3px var(--bg);transition:left .8s var(--spring)}
.mh-track.at .mh-dot{background:var(--blue)}
.mh-ends{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;line-height:14px;color:var(--ink-50);font-variant-numeric:tabular-nums}

/* ---------- measure log: weeks of weigh-ins on cards ---------- */
#mlog{margin-top:6px}
.lweek{display:flex;align-items:baseline;margin:20px 4px 8px;font-size:13px;line-height:16px;font-weight:510;color:var(--ink-50)}

.sh-ic:disabled{opacity:.35}
/* summary, warning, actions */
.sh-sum{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--fill-6);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}

.sh-warn{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 10px 10px 14px;border-radius:18px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.05);font-size:13px;line-height:17px}

.sh-act{display:flex;align-items:center;gap:8px;margin-top:18px}
.sh-act[hidden]{display:none}
.sheet .sbtn.primary{width:100%;margin:18px 0 0;padding:0 20px;box-shadow:none}

.sheet .sbtn.primary:disabled{background:var(--fill-8);color:rgba(0,0,0,.35);box-shadow:none}

.sbtn .sv:not(:empty){margin-left:4px;padding-left:12px;box-shadow:inset 1px 0 0 rgba(255,255,255,.25)}
.sheet .sbtn.plain,.sheet .sbtn.danger{width:auto;height:40px;padding:0 18px;margin:10px auto 0;font-size:15px}
.sheet .btnrow{justify-content:center;margin-top:10px}
.sheet .btnrow .sbtn{flex:none;margin:0}
.sheet .btnrow.wide{margin-top:16px}

/* ---------- sheets in grey (canvas «Sheets · grey fields», B and G) ---------- */
.vt{background:var(--fill-6);box-shadow:none}
.vt-calc{background:var(--fill-3)}
.sheet .seg button{background:var(--fill-6);box-shadow:none}
.sheet .seg button.on{background:#000;color:#fff}
.sheet h3 .x,.sh-head .x{background:var(--fill-6);box-shadow:none}
.sh-ic.big{background:var(--fill-6);box-shadow:none}
.sh-warn{background:var(--fill-6);box-shadow:none}
.sheet .tfield{background:var(--fill-6);box-shadow:none}

/* ---------- menus in the sheet style (canvas «Menus»): Пробы = menu 1, Bulk plan = sheet 2, Sort = sheet 2 ---------- */
.menu.mp{width:320px;padding:8px;border-radius:28px;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 0 2px rgba(0,0,0,.08),0 16px 50px rgba(0,0,0,.18)}

/* rows inside sheets */
.sh-rows{display:flex;flex-direction:column;gap:6px}
.sh-row{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;box-sizing:border-box;padding:0 14px;border-radius:18px;background:var(--fill-6);text-align:left;color:var(--ink);transition:background-color .2s,color .2s,transform .2s var(--spring)}
button.sh-row:active{transform:scale(.98)}

.sh-row .t b{font-size:16px;font-weight:600;letter-spacing:-.2px}

.gm-on .sh-dots i.o{background:#fff}.gm-on .sh-dots i.u{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}.gm-on .sh-dots i.k{background:#6f9bf0}

.gm-on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(0,0,0,.07)}
.gm-t{background:var(--fill-6)}
.gm-h>.sh-dots{opacity:1}
.gm-on .sh-dots i.o{background:#000}.gm-on .sh-dots i.u{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.4)}.gm-on .sh-dots i.k{background:var(--blue)}
/* ---------- selection style 2 (chosen 22 Oct, use everywhere): the chosen item gets a light grey fill (+ check in lists); the others have no fill ---------- */

  hd.setAttribute('cx', px); hd.setAttribute('cy', py); hd.setAttribute('opacity', 1);
  const tip = $('#tip');

  const tw2 = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(r.width - tw2, px - tw2 / 2)) + 'px';

  const app = document.querySelector('.app'); if (!app) return;
  if (!maOn()) { app.style.minHeight = ''; return; }
  // natural content height with the header fully open (measured without touching layout-affecting styles)
  const last = [zlist, zHead, list].find(e => !e.hidden && e.offsetParent); if (!last) return;
  const bottom = last.getBoundingClientRect().bottom + scrollY + parseFloat(getComputedStyle(app).paddingBottom) + MA_SHRINK * Math.max(0, maC);
  if (bottom - innerHeight > 1) app.style.minHeight = `calc(100vh + ${MA_TITLE + MA_SHRINK + 4}px)`;
  else { app.style.minHeight = ''; if (scrollY > 0) scrollTo(0, 0); }
}
let snapT;
const snapHead = () => { clearTimeout(snapT); snapT = setTimeout(() => {
  if (!maOn() || touching || precise || drag || performance.now() - dragEndAt < 900) return;
  const y = scrollY, end = MA_TITLE + MA_SHRINK;
  if (y > 2 && y < end - 2) scrollTo({ top: y < end / 2 ? 0 : end, behavior: RM ? 'auto' : 'smooth' });
}, 140); };
addEventListener('scroll', () => { collapse(); if (!touching) snapHead(); }, { passive: true });
addEventListener('touchend', () => snapHead(), { passive: true });
if (window.ResizeObserver) new ResizeObserver(setHH).observe(hdr); setHH(); collapse(true);
const stickTop = () => S.ui.tab === 'meal' ? mhead.getBoundingClientRect().bottom : 0;
let stuckRaf = 0;
addEventListener('scroll', () => { if (stuckRaf) return; stuckRaf = requestAnimationFrame(() => { stuckRaf = 0;
  if (S.ui.tab === 'meal') mhead.classList.toggle('stuck', scrollY > 2 && list.getBoundingClientRect().top < mhead.getBoundingClientRect().bottom + 4); }); }, { passive: true });

/* ================= boot ================= */
syncTabs(); renderAll(false); $('#planName').textContent = plan().name;
setTimeout(ndbAuto, 1200);
if (!RM) document.querySelectorAll('.plan > *, .tabsec:not([hidden]) > .list-head, .tabsec:not([hidden]) .list > *').forEach((el, i) => el.animate(
  [{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 520, delay: Math.min(i, 14) * 28, easing: SPRING, fill: 'backwards' }));
})();
